[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-crawler"
version = "0.1.0"
description = "A provenance-first lawful source collection crawler for dissertation research"
requires-python = ">=3.11"
dependencies = [
  "Scrapy>=2.13,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
research-crawler = "research_crawler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
